[package]
name = "ana_sim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ana_sim_engine"
path = "src/lib.rs"

[[bin]]
name = "ana_sim_viewer"
path = "src/bin/main.rs"

[dependencies]
nalgebra = "0.35.0"
ratatui = "0.30.2"
color-eyre = "0.6.5"
crossterm = "0.29.0"

[dev-dependencies]
assert_float_eq = "1.1.3"